<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel v1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f3f1ec;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }
    .slide {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfbfb 100%);
      border-radius: 20px;
      padding: 80px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.10);
    }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 1;
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #b2514f;
      font-weight: 800;
    }
    .pill {
      font-size: 20px;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 700;
      color: #1e1e1e;
      background: rgba(178, 81, 79, 0.12);
      border: 1px solid rgba(178, 81, 79, 0.18);
      padding: 10px 14px;
      border-radius: 999px;
    }
    h1, h2 { line-height: 1.08; color: #111111; letter-spacing: -0.8px; }
    h1 { font-size: 92px; }
    h2 { font-size: 64px; }
    p { font-size: 38px; line-height: 1.35; color: #2a2a2a; }
    .body {
      display: flex;
      flex-direction: column;
      gap: 18px;
      justify-content: center;
      flex: 1;
      position: relative;
      z-index: 1;
    }
    .subtitle {
      font-size: 36px;
      color: #2e2e2e;
      line-height: 1.28;
    }
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }
    li {
      font-size: 38px;
      line-height: 1.28;
      color: #242424;
      padding-left: 46px;
      position: relative;
    }
    li::before {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #b2514f;
      position: absolute;
      left: 8px;
      top: 18px;
      box-shadow: 0 10px 25px rgba(178, 81, 79, 0.28);
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 1;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      color: rgba(0, 0, 0, 0.55);
      font-size: 26px;
      letter-spacing: 0.2px;
    }
    .handle { font-weight: 700; color: rgba(0, 0, 0, 0.62); }
    .num { font-variant-numeric: tabular-nums; font-weight: 800; color: rgba(0, 0, 0, 0.62); }
    .muted { color: rgba(0, 0, 0, 0.58); }
    .em { font-weight: 900; }
  </style>
</head>
<body>
  <section class="slide">
    <div class="top">
      <div class="kicker">kicker <span class="pill">label</span></div>
      <div class="pill">01/10</div>
    </div>
    <div class="body">
      <h1>Заголовок<br>карусели</h1>
      <p class="subtitle">Подзаголовок или обещание пользы.</p>
      <p class="subtitle muted">Микро‑CTA: «Сохрани».</p>
    </div>
    <div class="footer">
      <div class="handle">@yourhandle</div>
      <div class="num">01/10</div>
    </div>
  </section>

  <section class="slide">
    <div class="top">
      <div class="kicker">slide</div>
      <div class="pill">02/10</div>
    </div>
    <div class="body">
      <h2>Заголовок слайда</h2>
      <ul>
        <li>Одна мысль на слайд</li>
        <li>Короткие строки, без перегруза</li>
        <li><span class="em">Жирным</span> — только ключевые слова</li>
      </ul>
    </div>
    <div class="footer">
      <div class="handle">@yourhandle</div>
      <div class="num">02/10</div>
    </div>
  </section>
</body>
</html>
