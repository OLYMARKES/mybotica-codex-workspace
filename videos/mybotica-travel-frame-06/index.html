    <style>
      @font-face {
        font-family: "Golos";
        src: url("assets/fonts/golos.ttf") format("truetype");
        font-style: normal;
        font-weight: 100 900;
      }

      :root {
        --green: #0f3a31;
        --cream: #f7f0e4;
        --paper: #e6d3bb;
        --red: #b63052;
      }

      * { box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        font-family: "Golos", sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper);
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      .travel-video {
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        object-position: center center;
      }

      #shade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(15, 58, 49, 0.08) 0%, rgba(15, 58, 49, 0) 42%, rgba(34, 23, 12, 0.22) 100%);
      }

      #chat {
        position: absolute;
        left: 54px;
        right: 54px;
        bottom: 68px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
      }

      .bubble {
        position: relative;
        display: block;
        padding: 25px 31px 29px;
        border-radius: 27px;
        box-shadow: 0 18px 34px rgba(43, 30, 16, 0.24);
        font-size: 43px;
        font-weight: 660;
        line-height: 1.13;
        letter-spacing: -0.025em;
        transform-origin: 50% 100%;
        will-change: transform, opacity;
      }

      .bubble::after {
        content: "";
        position: absolute;
        bottom: -26px;
        width: 0;
        height: 0;
        border-style: solid;
      }

      .bubble-human {
        align-self: flex-start;
        width: max-content;
        max-width: 650px;
        border: 3px solid rgba(15, 58, 49, 0.24);
        background: rgba(247, 240, 228, 0.98);
        color: var(--green);
      }

      .bubble-human::after {
        left: 36px;
        border-width: 27px 29px 0 0;
        border-color: rgba(247, 240, 228, 0.98) transparent transparent transparent;
      }

      .bubble-bot {
        align-self: flex-end;
        display: grid;
        grid-template-columns: 215px 1fr;
        align-items: center;
        gap: 24px;
        width: 914px;
        background: var(--green);
        color: var(--cream);
      }

      .bubble-bot::after {
        right: 34px;
        border-width: 27px 0 0 29px;
        border-color: var(--green) transparent transparent transparent;
      }

      .answer-logo {
        display: block;
        width: 215px;
        height: 58px;
        background: url("assets/source/mybotica-logo-transparent.png") center / contain no-repeat;
      }

      #q2 { margin-top: 17px; }
      #a2 { width: 620px; }

    </style>
  </head>
