<!DOCTYPE html>
<html lang="ru">
<head></head>
<body>
<template>
  <style>
    @font-face{font-family:Unbounded;src:url('assets/fonts/unbounded.ttf')}
    @font-face{font-family:Golos;src:url('assets/fonts/golos.ttf')}
    *{box-sizing:border-box}
    #root{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;background:#f4ebdd;color:#10362c;font-family:Golos,Arial,sans-serif}
    .tag{position:absolute;left:60px;top:60px;font:700 30px/1 Unbounded;color:#a32631;will-change:transform}
    .title{position:absolute;left:60px;right:60px;top:210px;font:720 73px/1.06 Unbounded;letter-spacing:-.05em;will-change:transform}
    .definition{position:absolute;left:60px;right:60px;top:545px;font-size:46px;line-height:1.28;font-weight:700;will-change:transform}
    .steps{position:absolute;left:60px;right:60px;top:920px;display:grid;grid-template-columns:1fr;gap:34px}
    .step{padding:30px 32px;border:5px solid #10362c;background:#fffaf1;font:700 35px/1.1 Unbounded;will-change:transform}
    .step b{color:#a32631;margin-right:20px}
    .dragon{position:absolute;width:720px;height:auto;right:-65px;bottom:-4px;transform-origin:center bottom;will-change:transform}
  </style>
  <div data-hf-id="agent05-root" id="root" data-composition-id="agent-05-explanation" data-width="1080" data-height="1920" data-duration="3.8">
    <div data-hf-id="agent05-tag" id="agent05-tag" class="tag">А ТЕПЕРЬ НОРМАЛЬНО</div>
    <div data-hf-id="agent05-title" id="agent05-title" class="title">ЧТО ДЕЛАЕТ ИИ-АГЕНТ?</div>
    <div data-hf-id="agent05-definition" id="agent05-definition" class="definition">Это помощник, который получает задачу и выполняет её по заданным правилам.</div>
    <div data-hf-id="agent05-steps" class="steps">
      <div data-hf-id="agent05-step1" class="step"><b data-hf-id="agent05-b1">1</b>ПОЛУЧИЛ ЗАДАЧУ</div>
      <div data-hf-id="agent05-step2" class="step"><b data-hf-id="agent05-b2">2</b>СДЕЛАЛ ПО ПРАВИЛАМ</div>
      <div data-hf-id="agent05-step3" class="step"><b data-hf-id="agent05-b3">3</b>ОТЧИТАЛСЯ</div>
    </div>
    <img data-hf-id="agent05-dragon" id="agent05-dragon" class="dragon" src="assets/boy-explains-cutout.png" alt="Дракоша объясняет у доски">
  </div>
  <script>
    const tl=gsap.timeline({paused:true});
    tl.set('#agent05-tag',{opacity:1,y:42},.05).to('#agent05-tag',{y:0,duration:.15,ease:'power4.out'},.05);
    tl.set('#agent05-title',{opacity:1,y:74},.2).to('#agent05-title',{y:0,duration:.2,ease:'power4.out'},.2);
    tl.fromTo('#agent05-definition',{y:42,opacity:0},{y:0,opacity:1,duration:.38,ease:'power3.out'},.58);
    gsap.utils.toArray('.step').forEach((el,i)=>tl.fromTo(el,{x:-80,opacity:0},{x:0,opacity:1,duration:.34,ease:'power3.out'},1.08+i*.22));
    tl.fromTo('#agent05-dragon',{x:130,scale:.82,rotation:5,opacity:0},{x:0,scale:1,rotation:0,opacity:1,duration:.55,ease:'power3.out'},1.58);
    tl.to('#agent05-dragon',{rotation:-1.5,duration:.34,ease:'sine.inOut'},2.55).to('#agent05-dragon',{rotation:0,duration:.34,ease:'sine.inOut'},2.95);
    window.__timelines['agent-05-explanation']=tl;
  </script>
</template>
</body>
</html>
