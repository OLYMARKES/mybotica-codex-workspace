      .scene:not(:first-of-type) { opacity: 0; }
      .scene img { display: block; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; will-change: transform; }
      #scene-08, #scene-09 { background-color: #0f2a24; }
      #scene-01 { z-index: 1; }
      #scene-02 { z-index: 2; }
      #scene-03 { z-index: 3; }
      #scene-04 { z-index: 4; }
      #scene-05 { z-index: 5; }
      #scene-06 { z-index: 6; }
      #scene-07 { z-index: 7; }
      #scene-08 { z-index: 8; }
      #scene-09 { z-index: 9; }
    </style>

  <body>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const sceneStarts = [0, 1.5, 3.5, 5.5, 7.5, 9, 11, 12.5, 14];

      tl.fromTo("#scene-01 img", { scale: 0.97, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);

      for (let i = 1; i < sceneStarts.length; i += 1) {
        const oldScene = `#scene-${String(i).padStart(2, "0")}`;
        const newScene = `#scene-${String(i + 1).padStart(2, "0")}`;
        const newImage = `${newScene} img`;
        const at = sceneStarts[i];
        const transitionDuration = i === 7 || i === 8 ? 0.42 : 0.32;

        tl.to(oldScene, { opacity: 0, filter: "blur(6px)", scale: 1.018, duration: transitionDuration, ease: "power2.inOut" }, at);
        tl.fromTo(newScene, { opacity: 0, filter: "blur(5px)", scale: 0.988 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: transitionDuration, ease: "power2.inOut" }, at);
        tl.fromTo(newImage, { scale: i >= 7 ? 0.985 : 1.025 }, { scale: 1, duration: 0.72, ease: "power3.out", immediateRender: false }, at);
      }

      tl.fromTo("#scene-04 img", { rotation: -0.7 }, { rotation: 0.7, duration: 0.13, repeat: 5, yoyo: true, ease: "sine.inOut", immediateRender: false }, 6.05);
      tl.to("#scene-04 img", { rotation: 0, duration: 0.16, ease: "power2.out" }, 6.83);
      tl.fromTo("#scene-05 img", { scale: 0.94 }, { scale: 1, duration: 0.52, ease: "power3.out", immediateRender: false }, 7.5);
      tl.fromTo("#scene-09 img", { scale: 0.985 }, { scale: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, 14);

      window.__timelines["chat-overload-girl-v1"] = tl;
    </script>
